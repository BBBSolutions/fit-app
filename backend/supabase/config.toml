project_id = "your-project-id"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "auth"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[functions.auth-verify]
verify_jwt = false

[functions.profiles]
verify_jwt = false

[functions.clients]
verify_jwt = false

[functions.workouts]
verify_jwt = false

[functions.messages]
verify_jwt = false

[functions.send-sms]
enabled = true
verify_jwt = true
import_map = "./functions/send-sms/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-sms/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-sms/*.html" ]

[functions.create-branch]
verify_jwt = false
